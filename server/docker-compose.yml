# سيرفر ماينكرافت لك ولربعك (يحتاج Docker) — مع RCON عشان جسر الذكاء الاصطناعي الاختياري.
#   1) فك ضغط GoT_Westeros_Server_World.zip ووضع مجلد world جنب هذا الملف داخل مجلد mcdata:  ./mcdata/world
#   2) docker compose up -d
#   3) اللاعبون يدخلون على  <عنوانك>:25565
services:
  mc:
    image: itzg/minecraft-server:latest
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"                 # بتوافق على شروط ماينكرافت (EULA) بنفسك بتغيير هذي القيمة إلى TRUE
      TYPE: "VANILLA"
      VERSION: "LATEST"            # آخر إصدار (26.3 وقت كتابة هذا). إذا صار عندك خلل غيّره إلى 1.21.4
      MEMORY: "4G"
      DIFFICULTY: "normal"
      MODE: "survival"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "10"
      ALLOW_FLIGHT: "TRUE"
      MOTD: "حرب الممالك - وستيروس"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "غيّر-هذه-الكلمة"
      # OPS: "اسمك_في_ماينكرافت"
    volumes:
      - ./mcdata:/data
    restart: unless-stopped
