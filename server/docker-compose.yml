# Dedicated server for you and your friends (needs Docker).
#   1. Put the world folder next to this file:  ./world  (copy of GoT_Westeros, must contain level.dat)
#   2. docker compose up -d
#   3. Friends join with  <your-ip>:25565   (forward port 25565 on your router, or use a cloud VPS)
services:
  mc:
    image: itzg/minecraft-server:latest
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "VANILLA"
      VERSION: "1.21.4"
      MEMORY: "4G"
      DIFFICULTY: "normal"
      MODE: "survival"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "10"
      ALLOW_FLIGHT: "TRUE"
      MOTD: "Game of Thrones - Westeros"
      # OPS: "YourMinecraftName"     # uncomment and put your name to be operator
    volumes:
      - ./world:/data/world
    restart: unless-stopped
